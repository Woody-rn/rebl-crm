databaseChangeLog:
  - changeSet:
      id: 005-01-create-contacts
      author: reblcrm
      comment: "Контакты клиентов. company_id nullable — поддержка B2C (репетиторы, фрилансеры)"
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: contacts
      changes:
        - createTable:
            tableName: contacts
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_contacts_tenant
                    references: tenants(id)
              - column:
                  name: first_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(100)
              - column:
                  name: email
                  type: VARCHAR(255)
              - column:
                  name: phone
                  type: VARCHAR(50)
              - column:
                  name: company_id
                  type: UUID
              - column:
                  name: telegram_chat_id
                  type: VARCHAR(100)
              - column:
                  name: telegram_username
                  type: VARCHAR(100)
              - column:
                  name: timezone
                  type: VARCHAR(100)
              - column:
                  name: custom_data
                  type: JSONB
                  defaultValueComputed: "'{}'::jsonb"
              - column:
                  name: owner_id
                  type: UUID
                  constraints:
                    foreignKeyName: fk_contacts_owner
                    references: users(id)
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: TIMESTAMPTZ

  - changeSet:
      id: 005-02a-idx-contacts-tenant
      author: reblcrm
      comment: "Базовый индекс по tenant_id"
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                tableName: contacts
                indexName: idx_contacts_tenant_id
      changes:
        - createIndex:
            tableName: contacts
            indexName: idx_contacts_tenant_id
            columns:
              - column:
                  name: tenant_id

  - changeSet:
      id: 005-02b-idx-contacts-tenant-phone
      author: reblcrm
      comment: "Составной: поиск по телефону в рамках тенанта (покрывает RLS)"
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                tableName: contacts
                indexName: idx_contacts_tenant_phone
      changes:
        - createIndex:
            tableName: contacts
            indexName: idx_contacts_tenant_phone
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: phone

  - changeSet:
      id: 005-02c-idx-contacts-tenant-email
      author: reblcrm
      comment: "Составной: поиск по email в рамках тенанта"
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                tableName: contacts
                indexName: idx_contacts_tenant_email
      changes:
        - createIndex:
            tableName: contacts
            indexName: idx_contacts_tenant_email
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: email

  - changeSet:
      id: 005-02d-idx-contacts-tenant-telegram
      author: reblcrm
      comment: "Составной: поиск по Telegram chat_id в рамках тенанта"
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                tableName: contacts
                indexName: idx_contacts_tenant_telegram
      changes:
        - createIndex:
            tableName: contacts
            indexName: idx_contacts_tenant_telegram
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: telegram_chat_id

  - changeSet:
      id: 005-02e-idx-contacts-tenant-company
      author: reblcrm
      comment: "Составной: поиск контактов компании в рамках тенанта"
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                tableName: contacts
                indexName: idx_contacts_tenant_company
      changes:
        - createIndex:
            tableName: contacts
            indexName: idx_contacts_tenant_company
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: company_id

  - changeSet:
      id: 005-02f-idx-contacts-custom-data-gin
      author: reblcrm
      comment: "GIN-индекс для поиска по кастомным полям (JSONB)"
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                tableName: contacts
                indexName: idx_contacts_custom_data
      changes:
        - sql:
            sql: CREATE INDEX IF NOT EXISTS idx_contacts_custom_data ON contacts USING GIN (custom_data);
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS idx_contacts_custom_data;

  - changeSet:
      id: 005-03-enable-rls-contacts
      author: reblcrm
      changes:
        - sql:
            sql: |
              ALTER TABLE contacts ENABLE ROW LEVEL SECURITY;
              ALTER TABLE contacts FORCE ROW LEVEL SECURITY;

              DROP POLICY IF EXISTS tenant_isolation ON contacts;
              CREATE POLICY tenant_isolation ON contacts
                USING (tenant_id = NULLIF(current_setting('app.current_tenant', true), '')::uuid)
                WITH CHECK (tenant_id = NULLIF(current_setting('app.current_tenant', true), '')::uuid);

  - changeSet:
      id: 005-04-grant-contacts
      author: reblcrm
      changes:
        - sql:
            sql: GRANT SELECT, INSERT, UPDATE, DELETE ON contacts TO app_user;
