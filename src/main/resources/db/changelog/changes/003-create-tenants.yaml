databaseChangeLog:
  - changeSet:
      id: 003-01-create-tenants
      author: reblcrm
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: tenants
      changes:
        - createTable:
            tableName: tenants
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: slug
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: timezone
                  type: VARCHAR(100)
                  defaultValue: UTC
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false

  - changeSet:
      id: 003-02-grant-tenants
      author: reblcrm
      changes:
        - sql:
            sql: GRANT SELECT, INSERT, UPDATE, DELETE ON tenants TO app_user;