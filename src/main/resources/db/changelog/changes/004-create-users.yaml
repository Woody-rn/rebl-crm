databaseChangeLog:
  - changeSet:
      id: 004-01-create-users
      author: reblcrm
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: users
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_users_tenant
                    references: tenants(id)
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: first_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(100)
              - column:
                  name: role
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: telegram_user_id
                  type: VARCHAR(100)
              - column:
                  name: timezone
                  type: VARCHAR(100)
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: TIMESTAMPTZ

  - changeSet:
      id: 004-02-create-users-indexes
      author: reblcrm
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                tableName: users
                indexName: idx_users_tenant_id
      changes:
        - createIndex:
            tableName: users
            indexName: idx_users_tenant_id
            columns:
              - column:
                  name: tenant_id

  - changeSet:
      id: 004-03-create-users-unique-email
      author: reblcrm
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                tableName: users
                indexName: uq_users_email_active
      changes:
        - sql:
            sql: CREATE UNIQUE INDEX IF NOT EXISTS uq_users_email_active ON users (email) WHERE deleted_at IS NULL;
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS uq_users_email_active;

  - changeSet:
      id: 004-04-grant-users
      author: reblcrm
      changes:
        - sql:
            sql: GRANT SELECT, INSERT, UPDATE, DELETE ON users TO app_user;