spring:
  application:
    name: reblcrm

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:reblcrm}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-init-sql: "SET ROLE app_user"

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=5m

  web:
    error:
      include-message: always
      include-binding-errors: always

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-32-chars-min!}
    access-token-expiration: 900000      # 15 минут
    refresh-token-expiration: 604800000  # 7 дней

  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: reblcrm

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    ru.npepub.reblcrm: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG
